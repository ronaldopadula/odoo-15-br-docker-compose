# Odoo (14, 15, 16 ou 18) + PostgreSQL + proxy (Caddy) — uma instância por pasta.
# Os valores ${...} vêm do arquivo .env, gerado pelo instalar.sh (não versionado).
#
#   navegador ──> proxy (porta pública) ──> odoo (8069 / 8072) ──> db
#
# Só o proxy recebe conexões de fora. O Odoo e o PostgreSQL ficam numa rede
# interna do Docker, sem portas publicadas.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=postgres
    secrets:
      - db_password
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - interna

  odoo:
    image: ${ODOO_IMAGE:-odoo:15.0}  # versão definida pelo instalar.sh (VERSAO)
    restart: unless-stopped
    depends_on:
      - db
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # - ./entrypoint.sh:/entrypoint.sh   # descomente para instalar pacotes Python extras (etc/requirements.txt)
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    networks:
      - interna

  proxy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      # Porta de acesso da instância (ex.: http://IP:10015).
      # Com domínio, o docker-compose.https.yml acrescenta as portas 80 e 443.
      - "${HTTP_PORT:-10015}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/data:/data
      - ./proxy/config:/config
    networks:
      - interna

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  interna:
